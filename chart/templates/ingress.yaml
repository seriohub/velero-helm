{{- if eq .Values.exposure.mode "ingress" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "seriohub-velero.fullname" . }}-ingress
  labels:
  {{- include "seriohub-velero.labels" . | nindent 4 }}
  {{- with .Values.exposure.ingress.metadata.annotations }}
  annotations:
    {{- . | toYaml | nindent 4}}
  {{- end }}
spec:
  ingressClassName: {{ .Values.exposure.ingress.ingressClassName }}
  rules:
  - host: {{ .Values.exposure.ingress.host }}
    http:
      paths:
      - backend:
          service:
            name: {{ include "seriohub-velero.fullname" . }}-ui-clusterip-svc
            port:
              number: 80
        path: /
        pathType: Prefix
      {{- if not .Values.global.core }}
      - backend:
          service:
            name: {{ include "seriohub-velero.fullname" . }}-api-clusterip-svc
            port:
              number: 80
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: {{ include "seriohub-velero.fullname" . }}-api-clusterip-svc
            port:
              number: 80
        path: /ws
        pathType: Prefix
      {{- end }}
      {{- if .Values.global.core }}
      - backend:
          service:
            name: {{ include "seriohub-velero.fullname" . }}-core-clusterip-svc
            port:
              number: 80
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: {{ include "seriohub-velero.fullname" . }}-core-clusterip-svc
            port:
              number: 80
        path: /ws
        pathType: Prefix
        {{- end }}
  {{- if .Values.exposure.ingress.tls }}
  tls:
    {{- toYaml .Values.exposure.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}
